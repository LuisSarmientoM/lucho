<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Portada del repositorio lucho">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b3b66"/>
      <stop offset="100%" stop-color="#3178c6"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="640" fill="url(#g1)"/>

  <!-- Formas decorativas -->
  <g opacity="0.18">
    <rect x="-200" y="80" width="800" height="520" rx="40" fill="#ffffff" transform="rotate(-14 200 330)"/>
    <rect x="600" y="-120" width="900" height="760" rx="60" fill="#000000" transform="rotate(-8 1050 220)"/>
  </g>

  <!-- Panel principal -->
  <g transform="translate(80,120)">
    <rect width="1040" height="400" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#shadow)"/>

    <!-- Monograma/ícono -->
    <g transform="translate(40,40)">
      <circle cx="80" cy="80" r="80" fill="#ffffff" opacity="0.06"/>
      <rect x="28" y="28" width="104" height="104" rx="24" fill="#ffffff" opacity="0.08"/>
      <text x="80" y="120" font-family="Inter, Roboto, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff" text-anchor="middle" alignment-baseline="middle">L</text>
    </g>

    <!-- Título -->
    <text x="220" y="150" font-family="Inter, Roboto, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">lucho</text>

    <!-- Descripción / idiomas -->
    <text x="220" y="210" font-family="Inter, Roboto, Arial, sans-serif" font-size="22" fill="#e6f0ff">TypeScript • Shell</text>

    <!-- Barra de progreso de composición de lenguajes -->
    <g transform="translate(220,240)">
      <rect width="760" height="18" rx="9" fill="rgba(255,255,255,0.06)"/>
      <!-- TS 85% -->
      <rect width="646" height="18" rx="9" fill="#3178c6"/>
      <!-- Shell 15% -->
      <rect x="646" width="114" height="18" rx="9" fill="#4d5563"/>
      <text x="760" y="-6" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" fill="#e6f0ff" text-anchor="end">85% TypeScript • 15% Shell</text>
    </g>

    <!-- Ruta del repo -->
    <text x="220" y="330" font-family="Inter, Roboto, Arial, sans-serif" font-size="16" fill="#cfe7ff">github.com/LuisSarmientoM/lucho</text>
  </g>

  <!-- Pie decorativo -->
  <g transform="translate(60,560)">
    <rect width="1080" height="60" rx="12" fill="rgba(0,0,0,0.08)"/>
    <text x="40" y="38" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" fill="#e6f0ff">Proyecto con enfoque en TypeScript — portada generada automáticamente</text>
  </g>
</svg>
